<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002554">
<title>팀근무관리 앱 2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="팀근무">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --trust:#002554; --discovery:#003087; --green:#2F5BB7;
  --bg:#F2F4F6; --card:#FFFFFF; --text:#191F28; --sub:#6B7684; --line:#E5E8EB;
  --red:#E5484D; --paper:#FBF5D6; --paperLine:#2B2B2B; --ink:#1D2C7A;
  --hl:rgba(246,238,70,.72); --soft:#E8EEF8;
  --ui:"Pretendard Variable","Pretendard","Noto Sans Sinhala","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --pen:"Nanum Pen Script","Pen Local","Pretendard Variable",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101418;--card:#1A1F25;--text:#F2F4F6;--sub:#A0A8B3;--line:#2A3038;--soft:#1E2A3D;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101418;--card:#1A1F25;--text:#F2F4F6;--sub:#A0A8B3;--line:#2A3038;--soft:#1E2A3D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:96px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}

/* 상단 */
.top{background:var(--trust);color:#fff;padding:18px 0 22px}
.top .team{font-size:13px;opacity:.75}
.top .date{font-size:15px;font-weight:600;margin-top:4px}

/* 오늘 */
.q{font-size:27px;line-height:1.3;font-weight:700;margin:28px 0 6px;letter-spacing:-.02em}
.qsub{color:var(--sub);font-size:15px;margin:0 0 22px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbtn{border:2px solid var(--line);background:var(--card);border-radius:22px;padding:26px 10px 22px;text-align:center;transition:transform .12s,border-color .12s,background .12s}
.pbtn:active{transform:scale(.97)}
.pbtn .big{display:block;font-size:46px;font-weight:700;letter-spacing:-.03em;color:var(--discovery)}
.pbtn .small{display:block;font-size:14px;color:var(--sub);margin-top:4px}
.pbtn.on{background:var(--discovery);border-color:var(--discovery)}
.pbtn.on .big,.pbtn.on .small{color:#fff}
.saved{margin-top:14px;font-size:14px;color:var(--green);font-weight:600;min-height:20px;display:flex;justify-content:space-between;align-items:center}
.saved button{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;padding:6px}
.rest{background:var(--card);border-radius:22px;padding:26px 22px;margin-top:28px}
.rest h2{margin:0 0 8px;font-size:22px}
.rest p{margin:0;color:var(--sub);font-size:15px;line-height:1.55}
.rest .act{margin-top:16px;border:0;background:var(--soft);color:var(--discovery);font-weight:600;padding:12px 16px;border-radius:12px;font-size:15px}
.strip{margin-top:26px;width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:0;border-radius:18px;padding:18px 20px;text-align:left}
.strip .l{font-size:14px;color:var(--sub)}
.strip .v{font-size:22px;font-weight:700;color:var(--trust)}
.strip .v small{font-size:14px;font-weight:500;color:var(--sub);margin-left:2px}

/* 달력 */
.h1{font-size:25px;font-weight:700;margin:26px 0 4px;letter-spacing:-.02em}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.mnav b{font-size:18px}
.mnav button{border:0;background:var(--card);width:42px;height:42px;border-radius:12px;font-size:20px}
.cal{background:var(--card);border-radius:20px;padding:10px 8px 12px}
.cal .wk,.cal .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wk div{text-align:center;font-size:12px;color:var(--sub);padding:6px 0}
.cal .wk div:nth-child(6){color:var(--discovery)} .cal .wk div:nth-child(7){color:var(--red)}
.cell{border:0;background:none;aspect-ratio:1/1.12;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;font-size:15px;gap:3px;position:relative}
.cell.sat{color:var(--discovery)} .cell.red{color:var(--red)}
.cell.today .n{background:var(--trust);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;margin-top:-4px}
.cell:disabled{cursor:default}
.cell .hn{font-size:9px;color:var(--red);line-height:1.1;text-align:center}
.chip{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;color:#fff}
.c-m{background:var(--discovery)} .c-h{background:#8FAAE0} .c-a{background:var(--green)}
.cell.lv{background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:12px 4px 0;font-size:13px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.plist{margin-top:18px;background:var(--card);border-radius:20px;padding:6px 18px}
.plist .row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.plist .row:last-child{border:0}
.plist .empty{padding:16px 0;color:var(--sub);font-size:14px}

/* 출근표 종이 */
.paper{background:var(--paper);color:#222;border-radius:6px;padding:18px 14px 16px;box-shadow:0 1px 0 #e3d9a8,0 10px 24px -14px rgba(60,50,0,.35);margin-top:6px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pname{font-size:14px}
.pname button{border:0;border-bottom:1.5px solid #333;background:none;font-family:var(--pen);font-size:28px;color:var(--ink);padding:0 4px;min-width:110px;text-align:left;line-height:1}
.pname button.none{font-family:var(--ui);font-size:13px;color:#8a7f4a}
.pmonth{font-size:15px;white-space:nowrap}
.pmonth em{font-style:normal;font-family:var(--pen);font-size:30px;color:var(--ink);margin:0 10px}
.extra{font-family:var(--pen);color:var(--ink);font-size:22px;margin:12px 2px 2px;display:flex;gap:16px;flex-wrap:wrap}
.extra small{font-family:var(--ui);font-size:11px;color:#6d6440;margin-right:3px}
.sum{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--paperLine);margin-top:4px}
.sum div{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--paperLine);font-size:13px;min-height:42px}
.sum div:nth-child(odd){border-right:2px solid var(--paperLine)}
.sum div:nth-last-child(-n+2){border-bottom:0}
.sum b{font-family:var(--pen);font-weight:400;font-size:28px;color:var(--ink);line-height:1}
.sum .tot{background:rgba(0,48,135,.06)}
.sum .tot b{font-size:32px}
.halves{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
table.pt{width:100%;border-collapse:collapse;border:2px solid var(--paperLine);table-layout:fixed}
.pt th{font-size:11px;font-weight:500;border:1px solid var(--paperLine);padding:4px 2px;line-height:1.2}
.pt th:first-child{width:17%}
.pt td{border:1px solid var(--paperLine);height:36px;text-align:center;padding:0 2px;font-family:var(--pen);font-size:25px;color:var(--ink);line-height:1}
.pt td.d{font-family:var(--ui);font-size:13px;color:#222}
.pt tr{cursor:pointer}
.pt tr.hl td{background:linear-gradient(176deg,transparent 18%,var(--hl) 22%,var(--hl) 80%,transparent 86%)}
.pt tr.fut td{opacity:.42}
.pt tr.fut td.d{opacity:.6}
.pt tr.nod{cursor:default} .pt tr.nod td{color:transparent}
.pt td.stamp{font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.3em;color:#8C8A6E}
.cell .wt{font-size:11px;font-weight:600;color:var(--discovery)}
.pt td.lv{font-family:var(--ui);font-weight:700;font-size:14px;letter-spacing:.2em;color:#24308a}
.pt td.hol{font-family:var(--ui);font-size:11px;color:var(--red)}
.pt td.miss{font-family:var(--ui);font-size:11px;color:#c0392b;opacity:.75}
.pt td small{font-family:var(--ui);font-size:9px;color:#6d6440;display:block}
.pt tr.now td.d{background:var(--trust);color:#fff}
.pt tfoot td{border:0;height:30px;font-size:22px;cursor:default}
.pnote{font-size:12px;color:#6d6440;margin:12px 2px 0;line-height:1.5}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--green);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}

/* 하단 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--trust);font-weight:700}

/* 모달 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}
.dim.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pbtn{transition:none}}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet p{margin:0 0 16px;color:var(--sub);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px 8px;font-size:17px;font-weight:700;text-align:center}
.opt small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:3px}
.opt.on{border-color:var(--discovery);background:var(--soft);color:var(--discovery)}
.opt.del{grid-column:1/-1;color:var(--red);font-weight:600;font-size:15px;padding:13px}
.opt.full{grid-column:1/-1}
.close{margin-top:12px;width:100%;border:0;background:var(--bg);border-radius:14px;padding:14px;font-size:15px}
.sheet input{width:100%;font:inherit;font-size:18px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}
.sheet input:focus{outline:none;border-color:var(--discovery)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--trust);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;white-space:nowrap}
.toast.show{opacity:1}
.top{padding:14px 0}
.top .team{font-size:14px;opacity:.9;font-weight:600}
.tcard{background:var(--card);border:2.5px solid var(--discovery);border-radius:26px;margin-top:16px;min-height:64vh;padding:28px 18px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.tcard .td{color:var(--sub);font-size:16px}
.tcard .q{margin:10px 0 6px;font-size:27px}
.tcard .qsub{margin:0 0 24px}
.tcard .pbtn{background:var(--soft);border-color:transparent;padding:30px 8px 26px}
.tcard .pbtn .big{font-size:28px;color:var(--text)}
.tcard .pbtn.on{background:var(--discovery)}
.tcard .pbtn.on .big{color:#fff}
.etc{margin-top:12px;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px;font-size:17px}
.tcard .saved{justify-content:center;gap:10px}
.thint{margin:18px 0 0;color:var(--sub);font-size:14px}
.msum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;text-align:left}
.msum .lbl{font-size:12px;color:var(--sub);display:block}
.msum b{font-size:19px;color:var(--trust)}
.msum .r{font-size:12px;color:var(--sub);line-height:1.65;text-align:right}
.msum .r em{font-style:normal;color:var(--red)}
.cell{transition:transform .1s,background .12s,box-shadow .12s}
.cell:active{transform:scale(.86);background:var(--soft)}
.cell.sel{background:var(--soft);box-shadow:inset 0 0 0 2px var(--discovery);transform:scale(.94)}
.c-w{background:#4F6FA8} .c-x{background:#8B95A1} .c-e{background:#6B7684} .c-l{background:#B0B8C1}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--discovery);background:var(--card);color:var(--discovery);border-radius:16px;padding:14px;font-size:16px;font-weight:700;margin-bottom:12px}
.cbtn svg{width:22px;height:22px}
.card2{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card2 h4{margin:0 0 6px;font-size:16px}
.card2 p{margin:0 0 12px;color:var(--sub);font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two button{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;background:var(--soft);color:var(--discovery)}
.two button.pri{background:var(--discovery);color:#fff}
.cres{display:flex;gap:12px;align-items:flex-start}
.cres img{width:64px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;flex:none}
.cres .st{font-size:17px;font-weight:700}
.cres .st.ok{color:var(--green)} .cres .st.bad{color:var(--red)}
.dlist{margin-top:10px;border-top:1px solid var(--line)}
.dlist button{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;font-size:14px;text-align:left}
.dlist button span:last-child{color:var(--sub);text-align:right}
.dlist b{color:var(--red)}
.minor{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;padding:8px 0 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--discovery);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.minp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.minp label{font-size:12px;color:var(--sub)}
.minp input{width:100%;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:none;align-items:center;justify-content:center}
.viewer.show{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.pt tr.diff td.d{background:var(--red);color:#fff}
.pt td.stamp.ask{opacity:.55}
.pname span{font-family:var(--pen);font-size:28px;color:var(--ink);border-bottom:1.5px solid #333;padding:0 6px;min-width:110px;display:inline-block}
.top .wrap{display:flex;justify-content:space-between;align-items:center}
.rolep{border:0;background:#fff;color:var(--trust);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700}
body.lead .rolep{background:var(--green);color:#fff}
body.lead .top{background:#001A3D}
.tabs .in{grid-template-columns:repeat(var(--tn,3),1fr)}
.thead{display:flex;justify-content:space-between;align-items:flex-end;margin:18px 2px 12px}
.thead .td{font-size:14px;color:var(--sub)}
.thead .tt{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.thead .tsum{font-size:13px;color:var(--sub);text-align:right}
.thead .tsum b{color:var(--text);font-size:17px}
.board{background:var(--card);border-radius:20px;padding:2px 14px}
.grp{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.board .grp:last-child{border:0}
.gl{width:70px;flex:none;font-size:13px;color:var(--sub);line-height:1.2}
.gl b{display:block;font-size:28px;line-height:1;margin-bottom:4px}
.k6 b{color:var(--discovery)} .k5 b{color:#5B8DEF} .kh b{color:#6B7684} .ko b{color:#8B95A1} .kn b{color:var(--red)}
.names{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.nchip{border:0;background:var(--bg);border-radius:10px;padding:8px 11px;font-size:15px;font-weight:600;transition:transform .1s}
.nchip:active{transform:scale(.94)}
.nchip i{font-style:normal;font-size:11px;color:var(--discovery);margin-left:4px}
.nchip em{font-style:normal;font-size:12px;color:var(--sub);margin-left:5px;font-weight:500}
.nchip.me{background:var(--soft);color:var(--discovery)}
.kn .nchip,.grp.kn .nchip{background:#FFF1F1}
.none{font-size:13px;color:var(--sub);padding-top:9px}
.talert{background:#FFF1F1;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:13px;line-height:1.6}
.talert b{color:var(--red)}
.cfm{background:var(--card);border:2px solid var(--discovery);border-radius:20px;padding:16px;margin-top:12px}
.cq{font-size:16px;font-weight:700;margin-bottom:12px}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick2 button{border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:700;background:var(--discovery);color:#fff}
.pick2 button[data-t="5"]{background:var(--soft);color:var(--discovery)}
.cfm p{margin:10px 0 0;font-size:13px;color:var(--sub)}
.cfm p button{border:0;background:none;color:var(--discovery);font-weight:600;font-size:13px;text-decoration:underline;padding:0 4px}
.cfm.done2{background:var(--discovery);border-color:var(--discovery);color:#fff;display:flex;justify-content:space-between;align-items:center}
.done2 div{font-size:20px;font-weight:700}
.done2 span{font-size:13px;opacity:.75;font-weight:500;margin-left:6px}
.done2 button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:8px 12px;font-size:13px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.acts button{border:0;border-radius:14px;padding:14px 8px;font-size:15px;font-weight:600;background:var(--soft);color:var(--discovery)}
.acts .pri{background:var(--green);color:#fff}
.lnk{border:0;background:none;color:var(--discovery);font-weight:600;font-size:12px;text-decoration:underline;padding:0 2px}
.subl{font-size:12px;color:var(--sub);margin:10px 2px 0}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:14px;font-size:14px;line-height:1.6;margin-bottom:12px}
.big-btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:var(--green);color:#fff}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:22px;padding:3px}
.seg button{border:0;background:none;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;padding:7px 16px;border-radius:18px;transition:background .15s,color .15s,transform .1s}
.seg button.on{background:#fff;color:var(--trust);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.seg button:active{transform:scale(.93)}
.thero{background:var(--trust);color:#fff;border-radius:22px;padding:20px 18px 16px;margin-top:16px}
.thd{font-size:13px;opacity:.7}
.ttl{font-size:23px;font-weight:700;margin-top:2px;letter-spacing:-.02em}

/* ===== 관리자: 홈페이지형 ===== */
body.wide{padding-bottom:0}
body.wide .top,body.wide main>.credit{display:none}
body.wide main.wrap{max-width:none;padding:0}
body.wide::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--card)}
.sin{max-width:1180px;margin:0 auto;padding:0 28px}
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.sbar .sin{display:flex;align-items:center;gap:16px;height:64px}
.sbrand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;flex:none}
.slogo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--trust),var(--discovery));display:grid;place-items:center;color:#fff}
.slogo svg{width:20px;height:20px}
.stxt b{display:block;font-size:16px;letter-spacing:-.02em;color:var(--text)}
.stxt small{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
.snav{display:flex;gap:2px;margin-left:16px;flex:1;min-width:0;order:2}
.snav button{border:0;background:none;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap}
.snav button:hover{background:var(--soft);color:var(--discovery)}
.sact{display:flex;gap:8px;flex:none;margin-left:auto;order:3}
.sgear{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.sgear svg{width:16px;height:16px}
.sclose{border:0;background:var(--trust);color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600}
.shero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#002554 0%,#003087 60%,#2F5BB7 100%);padding:46px 0 34px}
.shero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 90%);mask-image:linear-gradient(180deg,#000,transparent 90%)}
.shero::after{content:"";position:absolute;right:-140px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(91,133,214,.32),transparent 65%)}
.shero .sin{position:relative;z-index:1}
.seye{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.03em;color:rgba(255,255,255,.78)}
.seye::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(169,196,245,.35)}
.shero h1{margin:10px 0 6px;font-size:40px;letter-spacing:-.03em;line-height:1.15;word-break:keep-all}
.shero p{margin:0;font-size:15px;color:rgba(255,255,255,.78);line-height:1.55;word-break:keep-all}
.sren{margin-top:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.sback{border:0;background:none;color:rgba(255,255,255,.85);font-size:14px;font-weight:600;padding:0;margin-bottom:14px;display:block}
.skpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.skpi>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:16px 18px;min-width:0}
.skpi b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skpi b.sm{font-size:21px;padding:4px 0 3px}
.skpi span{display:block;font-size:12.5px;color:rgba(255,255,255,.72);margin-top:4px;word-break:keep-all}
.skpi .warn b{color:#FFB3B5} .skpi .ok b{color:#CFE0FF}
.sbody{padding:26px 0 8px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:18px;align-items:start}
.sgrid.tm{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.scol{display:grid;gap:18px;min-width:0}
.spanel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0;scroll-margin-top:calc(84px + env(safe-area-inset-top,0px));box-shadow:0 1px 2px rgba(0,37,84,.04),0 12px 28px -22px rgba(0,37,84,.35)}
.sph{margin-bottom:14px}
.snum{font-size:12px;font-weight:700;color:var(--discovery);letter-spacing:.08em}
.sph h2{margin:4px 0;font-size:19px;letter-spacing:-.02em}
.sph p{margin:0;font-size:13.5px;color:var(--sub);line-height:1.5;word-break:keep-all}
.sadd{display:flex;gap:8px;margin:0 0 10px;max-width:440px}
.sadd input{flex:1 1 auto;width:100%;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.sadd input:focus{outline:none;border-color:var(--discovery);background:var(--card)}
.sadd button{flex:none;white-space:nowrap;border:0;background:var(--trust);color:#fff;border-radius:12px;padding:0 15px;font-size:14.5px;font-weight:600}
.ssteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px;scroll-margin-top:calc(84px + env(safe-area-inset-top,0px))}
.sstep{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;min-width:0}
.sstep i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;background:var(--soft);color:var(--discovery)}
.sstep.done i{background:var(--green);color:#fff}
.sstep div{min-width:0}
.sstep b{display:block;font-size:14.5px}
.sstep span{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.sfoot{border-top:1px solid var(--line);margin-top:28px;padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px))}
.sfoot .sin{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.sfoot b{font-size:14px;margin-right:10px}
.sfoot span{font-size:12.5px;color:var(--sub)}
.sfoot .sby{color:#B0B8C1;font-size:11px;letter-spacing:.05em}
.arow:hover{background:var(--bg)}
@media (max-width:860px){
  .sgrid,.sgrid.tm{grid-template-columns:minmax(0,1fr)}
  .skpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ssteps{grid-template-columns:minmax(0,1fr);gap:8px}
}
@media (max-width:640px){
  .sin{padding:0 16px}
  .sbar .sin{height:auto;flex-wrap:wrap;gap:6px 10px;padding-top:10px}
  .sact{order:2}
  .snav{order:3;flex:1 0 100%;margin:0 -16px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none}
  .snav::-webkit-scrollbar{display:none}
  .snav button{padding:8px 10px;font-size:13.5px}
  .sgear span{display:none}
  .shero{padding:28px 0 22px}
  .shero h1{font-size:28px}
  .shero p{font-size:14px}
  .skpi{gap:8px;margin-top:20px}
  .skpi>div{padding:12px 14px;border-radius:14px}
  .skpi b{font-size:24px} .skpi b.sm{font-size:17px}
  .sbody{padding:18px 0 4px}
  .spanel{padding:18px 16px;border-radius:18px}
  .sadd{max-width:none}
  .sadd input{padding:9px 11px}
  .sadd button{padding:0 13px;font-size:14px}
  .sstep{padding:12px 14px}
}
/* ===== 관리자 v2: 대시보드형 ===== */

.askc h4 span{color:var(--discovery);font-size:14px;margin-left:4px}
.askc p{margin-bottom:6px}
.askr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.askr b{display:block;font-size:15px}
.askr small{font-size:12px;color:var(--sub)}
.askr .two{flex:none;grid-template-columns:auto auto}
.askr .two button{padding:9px 12px;font-size:14px}
.adbig .num.none{font-size:15px;font-weight:600;color:var(--sub);letter-spacing:0;padding:18px 0 6px}

/* ===== 쉬는 날 계획: 달력이 주인공 · 나머지는 작게 · 연한 색 ===== */
#v-leave .h1{font-size:19px;margin:18px 2px 4px}
#v-leave .qsub{font-size:12.5px;line-height:1.55;margin:0 2px 12px;word-break:keep-all}
#v-leave .mnav{margin:6px 0 8px}
#v-leave .mnav b{font-size:16px}
#v-leave .mnav button{width:32px;height:32px;border-radius:10px;font-size:16px;color:var(--sub)}
#v-leave .fillb{margin:0 2px 10px;gap:6px}
#v-leave .fillb span{font-size:12px;font-weight:500}
#v-leave .fillb button{border:1px solid var(--line);color:#5B7FC4;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:10px}
#v-leave .cal{padding:14px 6px 16px;border-radius:22px;box-shadow:0 6px 20px -12px rgba(0,37,84,.18)}
#v-leave .cal .wk div{font-size:12px;padding:4px 0 10px}
#v-leave .cal .wk div:nth-child(6),#v-leave .cell.sat{color:#5B7FC4}
#v-leave .cal .wk div:nth-child(7),#v-leave .cell.red{color:#E97A7D}
#v-leave .cell{aspect-ratio:1/1.3;font-size:18px;font-weight:500;padding-top:8px;gap:5px;border-radius:14px}
#v-leave .cell.lv{background:none}
#v-leave .cell.today .n{background:#E3EBFA;color:#2F5BB7;font-weight:700;width:32px;height:32px;margin-top:-5px}
#v-leave .cell .wt{font-size:11px;font-weight:500;color:#8DA3CF}
#v-leave .cell .hn{font-size:9.5px;color:#E97A7D}
#v-leave .chip{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px}
#v-leave .c-m{background:#DDE8FB;color:#2C5AA8}
#v-leave .c-a{background:#DCF1E8;color:#23795A}
#v-leave .c-h{background:#FFEFD6;color:#A4620A}
#v-leave .c-w{background:#ECE7FA;color:#5A47A6}
#v-leave .c-x{background:#FDE6E6;color:#C24040}
#v-leave .c-e,#v-leave .c-l{background:#EEF0F3;color:#5F6B7A}
#v-leave .cell .oth{background:#EEF1F4;color:#7B8794}
#v-leave .legend{font-size:11.5px;gap:6px 12px;margin:14px 6px 0}
#v-leave .legend i{width:9px;height:9px;border-radius:50%}
#v-leave .legend i.c-m{background:#7FA3E6} #v-leave .legend i.c-a{background:#6CC3A0}
#v-leave .legend i.c-h{background:#F5B95B} #v-leave .legend i.c-w{background:#A898E0}
#v-leave .plist{margin-top:14px;padding:2px 16px}
#v-leave .plist .row{font-size:13.5px;padding:11px 0}

/* ===== 우리 조 · 오늘 현황: 누가 몇 시 퇴근인지가 주인공 ===== */
#v-team{padding-top:18px}
#v-team>*{margin-top:0;margin-bottom:20px}
.tmain{background:var(--card);border-radius:22px;padding:20px 18px 8px;border:1px solid #E3E9F2;box-shadow:0 10px 26px -16px rgba(0,37,84,.25)}
.tmh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tmh b{font-size:15px;color:var(--sub);font-weight:600}
.tmh span{font-size:12px;color:var(--sub)}
.trw{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.tmain .trw:last-child{border:0}
.trl{width:76px;flex:none;padding-top:5px}
.trl b{display:block;font-size:19px;letter-spacing:-.02em}
.trl span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.trn{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:8px}
.tnm{border:0;border-radius:11px;padding:8px 11px;font-size:16px;font-weight:600;background:#F1F4F9;color:var(--text)}
.tnm:active{transform:scale(.95)}
.tnm small{font-size:11px;font-weight:500;color:var(--sub);margin-left:5px}
.tnm.me{box-shadow:inset 0 0 0 1.5px #C9D1DC}
.tnone{font-size:15px;color:#B0B8C1;padding-top:8px}
/* 색은 5시·6시만, 나머지는 무채색 */
.tmain .trl b{color:var(--text)}
.tmain .tnm{background:#F2F4F6;color:var(--text)}
.k5 .trl b,.k6 .trl b{color:#2F5BB7}
.k5 .tnm,.k6 .tnm{background:#EAF0FB;color:#1F3F7A}
.km .trl b,.ka .trl b,.kh .trl b,.ks .trl b,.kn .trl b,.kw .trl b,.ko .trl b{color:#4E5968;font-size:17px}
.tsend{background:#F3F6FB;border-radius:20px;padding:16px}
.tsend p{margin:0 0 12px;font-size:13px;color:var(--sub);text-align:center;line-height:1.5}
.tsend p em{font-style:normal;color:var(--text);font-weight:600}
.tsend .tcta{margin-top:0;padding:14px;font-size:16px}
#v-team .bulkb{padding:11px 14px}
#v-team .bulkb b{font-size:14px} #v-team .bulkb small{font-size:12px}
#v-team .bulkb>span:first-child{width:30px;height:30px;font-size:15px}
#v-team .subl{text-align:center}

/* 언어 선택: 상단 → 하단 제작 표기 위로, 같은 연한 톤 */
.credit .langf{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:inherit;font-size:12px;letter-spacing:0;padding:6px 10px;margin-bottom:4px;border-radius:8px}
.credit .langf:active{background:rgba(0,0,0,.04)}
.credit .langf svg{width:13px;height:13px}
.credit .shst{font-size:11px;margin-bottom:2px;min-height:0}
.credit .shst:empty{display:none}

/* 가입: 조장/조원 고르기 */
.rrole{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.rrole button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;text-align:center}
.rrole button b{display:block;font-size:16px}
.rrole button small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.rrole button.on{border-color:var(--discovery);background:var(--soft);color:var(--discovery)}
.rnote{margin:14px 2px 6px!important;font-size:13px!important;font-weight:600;color:var(--text)!important}
.rnote.sm{margin:6px 2px 0!important;font-size:12px!important;font-weight:400;color:var(--sub)!important;line-height:1.5}
.rteams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rteams button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.rteams button b{display:block;font-size:15px}
.rteams button small{display:block;font-size:11.5px;color:var(--sub);margin-top:1px}
.rteams button.on{border-color:var(--discovery);background:var(--soft);color:var(--discovery)}
.rteams .rnote,.rteams input{grid-column:1/-1}

.rteam{color:var(--discovery)}
.rcrew{margin:16px 2px 2px!important;font-size:12.5px!important;color:var(--sub)!important;text-align:center;line-height:1.5}
.rcrew b{color:var(--text)}
.msg{overflow-wrap:anywhere;word-break:break-all}

/* 연차를 크게, 주말 쉼 표시 */
.opt.big{font-size:20px;padding:20px 8px}
#v-leave .c-o,.c-o{background:#EEF0F3;color:#6B7684}

/* ===== 식단 ===== */
.meal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:18px;color:var(--text)}
.meal:active{transform:scale(.99);background:var(--bg)}
.tcard .wx+.meal{margin-top:-8px}
.meali{flex:none;width:36px;height:36px;border-radius:11px;background:#FFF3E0;color:#B5651D;display:grid;place-items:center}
.meali svg{width:20px;height:20px}
.mealt{flex:1;min-width:0;display:block}
.mealt small{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.mealt b{display:block;font-size:17px;letter-spacing:-.02em;margin-top:1px;word-break:keep-all}
.mealt em{display:block;font-style:normal;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4;word-break:keep-all}
.mealg{flex:none;color:#B0B8C1;font-size:18px}
.meall{margin:4px 0 2px}
.mealr{display:flex;gap:12px;padding:12px 10px;border-radius:12px}
.mealr+.mealr{border-top:1px solid var(--line)}
.mealr.on{background:#FFF8EE;border-top-color:transparent}
.mealr.on+.mealr{border-top-color:transparent}
.meald{flex:none;width:34px;text-align:center}
.meald b{display:block;font-size:17px;line-height:1.1}
.meald span{font-size:11.5px;color:var(--sub)}
.mealm{flex:1;min-width:0}
.mealm p{margin:0!important;font-size:14.5px!important;color:var(--text)!important;line-height:1.5;word-break:keep-all}
.mealm p+p{margin-top:4px!important}
.mealm i{font-style:normal;font-size:11px;font-weight:600;color:#B5651D;background:#FFF3E0;border-radius:5px;padding:1px 5px;margin-right:6px}
.tcard .meal~.pick{min-height:118px}
.tcard .meal~.tdh{margin-bottom:14px}

/* 식단: 메인에는 글자 한 줄만 */
.meal1{display:block;width:100%;border:0;background:none;padding:0 4px;margin:-6px 0 18px;font-size:13px;color:var(--sub);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal1 span{font-weight:600;color:var(--text);margin-right:6px}
.tcard .meal1~.pick{min-height:140px}

/* ===== 오늘 화면: 퇴근 버튼이 주인공, 간격 넉넉하게 ===== */
.tcard{padding:26px 22px 26px}
.tcard .wx{margin-bottom:16px}
.tcard .meal1{margin:0 0 4px;font-size:13px}
.tcard .tdh{font-size:25px;margin:0 0 26px}
.tcard .tdh,.tcard>.td:first-child{margin-top:auto;padding-top:28px}
.tcard .pick{gap:14px;min-height:170px!important;max-height:270px}
.tcard .pbtn{border-radius:24px;padding:20px 8px}
.tcard .pbtn .big{font-size:31px}
.tcard .pbtn .small{font-size:14.5px;margin-top:10px}
.tcard .etc{margin-top:18px;padding:18px}
.tcard .saved{margin-top:20px}
.tcard .thint{margin-top:auto;padding-top:30px}
.tcard .q{margin:14px 0 10px}
.tcard .qsub{margin:0 0 30px;line-height:1.6}
.tcard .meal1{opacity:.5}
.testb{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 2px);transform:translateX(-50%);z-index:40;background:#FFE9A8;color:#6B4E00;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:0 0 8px 8px;pointer-events:none;white-space:nowrap}

/* ===== 하단: 한국어·제작 표기를 탭 바로 위 한 줄로, 메인 박스는 그만큼 길게 ===== */
body{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
body.wide{padding-bottom:0}
.credit{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 10px;margin:10px 0 4px}
.credit .shst{flex:1 0 100%;margin:0}
.credit .langf{margin:0;padding:4px 6px;font-size:11px}
#v-today:not([hidden]){min-height:calc(100vh - 172px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 172px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.tcard{padding:28px 22px 30px}
.tcard .wx{margin-bottom:18px}
.tcard .tdh{margin:0 0 30px}
.tcard .tdh,.tcard>.td:first-child{padding-top:34px}
.tcard .pick{gap:14px;min-height:180px!important;max-height:300px}
.tcard .etc{margin-top:22px}
.tcard .saved{margin-top:22px}
.tcard .thint{padding-top:34px}

/* 손글씨체(나눔손글씨 펜, OFL): 숫자와 자주 쓰는 이름 글자를 파일에 넣어 둬서 인터넷 글씨체를 못 불러와도 손글씨로 보여요 */

const TEST_FLAG = false;
const TEST = TEST_FLAG && !/github\.io$/i.test(location.hostname);

    S.rec[k] = x.t; if(x.reason) S.memo[k] = {...(S.memo[k]||{}), reason:x.reason};

}
function reconcile(){ syncMine(); }

function allOut(){ const a = S.team.allOut; return a && a.date===todayK() ? a : null; }
function canBulk(r){ return !r || r==="5" || r==="6"; }
function syncAllOut(){
  const a = allOut(); if(!a || !S.name) return; S.synced = S.synced||{};
  const sig = "all|"+a.date+"|"+a.at; if(S.synced.all===sig) return;
  S.synced.all = sig; const k = todayK();
  if(canBulk(S.rec[k]) && S.rec[k]!==a.t){ S.rec[k] = a.t; save(); toast(`조장님이 오늘 전원 ${a.t}시 퇴근으로 바꿨어요`); } else save();
}
function allBan(){ const a = allOut(); return a ? `<div class="allban">📢 오늘은 조장님이 <b>전원 ${a.t}시 퇴근</b>으로 정했어요 <small>${hm(a.at)}</small></div>` : ""; }

function addNote(n,k,t,kind,prev){
  const notes = S.team.notes = S.team.notes||[];
  let wasAdd = false;
  for(let i=notes.length-1;i>=0;i--) if(notes[i].n===n && notes[i].k===k){ if(notes[i].kind==="add") wasAdd = true; notes.splice(i,1); }
  if(wasAdd && kind==="del") return;
  if(wasAdd && kind==="change"){ kind = "add"; prev = ""; }
  notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), n, k, t, prev:prev||"", kind, reason:(S.memo[k]||{}).reason||"", at:Date.now()});
  if(notes.length>200) notes.splice(0, notes.length-200);
}
function syncMine(){
  if(!S.co || !S.name) return; const L = S.team.leaves = S.team.leaves||{}; S.synced = S.synced||{};
  const rs = k => (S.memo[k]||{}).reason||"", nowT = Date.now();
  Object.keys(L).forEach(k=>{ const arr = L[k], i = arr.findIndex(x=>x.n===S.name); if(i<0) return;
    const x = arr[i], r = S.rec[k];
    if(x.by && S.synced[k]!==x.t+"|"+(x.at||"")) return;
    if(r===x.t){ if(!x.by) x.reason = rs(k); return; }
    if(LVT.includes(r)){ addNote(S.name,k,r,"change",x.t); Object.assign(x,{t:r, by:null, ok:false, cok:true, at:nowT, reason:rs(k)}); delete S.synced[k]; if(S.byLead) delete S.byLead[k]; }
    else { addNote(S.name,k,x.t,"del"); arr.splice(i,1); delete S.synced[k]; if(S.byLead) delete S.byLead[k]; }
    if(!arr.length) delete L[k]; });
  const n0 = new Date(), from = ymd(mk(n0.getFullYear(), n0.getMonth()-1, 1));
  Object.entries(S.rec).forEach(([k,r])=>{ if(!LVT.includes(r) || k<from) return; const arr = L[k]||[]; if(arr.some(x=>x.n===S.name)) return;
    arr.push({n:S.name, t:r, reason:rs(k), by:null, at:nowT, ok:false}); L[k] = arr; addNote(S.name,k,r,"add"); });
}

/* ===== 주차: 그 주 월~금을 다 나왔으면 일요일에 8 =====
   앱 쓰기 전 날짜라 모르면 "ask" → 일단 넣어두고 물어봄 */
const OKW = ["5","6","h","m","a","w","e"];
function firstKey(){ const ks = Object.keys(S.rec).sort(); return ks[0] || "9999-12-31"; }
function weekState(sun){
  const fk = firstKey(); let unk = false;
  for(let i=6;i>=2;i--){
    const k = ymd(mk(sun.getFullYear(), sun.getMonth(), sun.getDate()-i));
    if(HOL[k] || OKW.includes(S.rec[k])) continue;
    if(k < fk){ unk = true; continue; }
    return "no";
  }
  if(!unk) return "ok";
  const a = S.wk[ymd(sun)];
  return a===true ? "ok" : a===false ? "no" : "ask";
}
function askSundays(y,m){
  const t = todayK(), dim = mk(y,m+1,0).getDate(), out = [];
  for(let i=1;i<=dim;i++){ const d = mk(y,m,i); if(d.getDay()===0 && ymd(d)<=t && weekState(d)==="ask") out.push(d); }
  return out;
}

/* ===== 한 달 계산 (오늘까지) ===== */
function stats(y,m){
  const t = todayK(), dim = mk(y,m+1,0).getDate();
  const o = {tong:0,yeon:0,juCha:0,yu:0,wol:0,hyu:0,il:0};
  for(let i=1;i<=dim;i++){
    const d = mk(y,m,i), k = ymd(d), r = S.rec[k], dw = d.getDay();
    if(k>t) continue;
    if(r==="5") o.tong+=8;
    if(r==="6"){ o.tong+=8; o.yeon+=1.5; }
    if(r==="h"){ o.tong+=4; o.wol+=4; }
    if(r==="m"||r==="a") o.wol+=8;
    if(r==="e") o.tong+=EH[(S.memo[k]||{}).out]||0;
    if(r==="w" && dw!==0) o.hyu+=12;
    if(dw===6 || (HOL[k] && HOL[k][1] && dw!==0)) o.yu+=8;
    if(dw===0 && weekState(d)!=="no") o.juCha+=8;
  }
  o.total = o.tong+o.juCha+o.wol+o.yu+o.yeon+o.hyu;
  return o;
}
function missing(y,m){
  const t = todayK(), fk = firstKey(), dim = mk(y,m+1,0).getDate(); let n = 0;
  for(let i=1;i<=dim;i++){ const d = mk(y,m,i), k = ymd(d), dw = d.getDay();
    if(k<=t && k>=fk && dw>=1 && dw<=5 && !HOL[k] && !S.rec[k]) n++; }
  if(!Object.keys(S.rec).length){ const k = todayK(), d = new Date(); if(d.getDay()>=1 && d.getDay()<=5 && !HOL[k]) n = 1; }
  return n;
}

function parseWx(j){

  let rain = 0; for(let h=7;h<=18;h++){ const i = H.time.indexOf(`${t}T${String(h).padStart(2,"0")}:00`); if(i>=0 && H.precipitation_probability) rain = Math.max(rain, H.precipitation_probability[i]||0); }
  const di = D.time.indexOf(t), dy = D.time.indexOf(y);
  return {min:D.temperature_2m_min[di], max:D.temperature_2m_max[di], code:D.weather_code[di], ymin:dy>=0?D.temperature_2m_min[dy]:null, ymax:dy>=0?D.temperature_2m_max[dy]:null,

}

function appDay(d,k){

function compare(y,m){
  const c = S.chk[ymk(y,m)]; if(!c || !c.paper) return null;
  const st = stats(y,m), P = c.paper, out = {sum:[], days:[]};
  const map = [["작업시간","tong"],["주차","juCha"],["월휴","wol"],["유휴","yu"],["가급","yeon"],["계","total"]];
  if(P.summary) map.forEach(([lab,key])=>{ const pv = +P.summary[lab]; if(P.summary[lab]!=null && P.summary[lab]!=="" && Math.abs(pv-st[key])>0.01) out.sum.push([lab,pv,st[key]]); });
  if(Array.isArray(P.days)) P.days.forEach(pd=>{

    const d = mk(y,m,pd.d), k = ymd(d), a = appDay(d,k);

function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const s = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>res({blob:b, data:c.toDataURL("image/jpeg",q)}), "image/jpeg", .85); };
    img.onerror = rej; img.src = url;
  });
}

  const T = [["A조","1반",.6],["B조","1반",1.5],["C조","2반",.25],["D조","2반",2.4],["E조","3반",1],["F조","3반",.8]];
  const KN = ["김","이","박","최","정","강","조","윤","장","임","한","오"], KG = ["민준","서준","도윤","현우","지호","성민","태윤","준혁","영수","동현","상철","기범","재훈","광수"];
  const FN = {"우즈베키스탄":["사르도르","알리셰르","자수르","베흐조드","루스탐","티무르","아지즈"],"스리랑카":["사만","니말","카순","루완","다누슈카","찬나"],"러시아":["이반","드미트리","세르게이","알렉세이","니키타"],"네팔":["라주","비노드","수만"],"베트남":["뚜안","흐엉","꽝"]};
  const pickNat = ()=>{ const x = r(); return x<.36?"한국":x<.6?"우즈베키스탄":x<.77?"스리랑카":x<.89?"러시아":x<.95?"네팔":"베트남"; };
  const teams = T.map(([name,ban,f])=>{ const n = 6+Math.floor(r()*4), crew = [];
    for(let i=0;i<n;i++){
      const nat = pickNat(); let nm, g = 0;
      do{ nm = nat==="한국" ? KN[Math.floor(r()*KN.length)]+KG[Math.floor(r()*KG.length)] : FN[nat][Math.floor(r()*FN[nat].length)]; if(++g>6 && used.has(nm)) nm += " "+(i+1); }while(used.has(nm));
      used.add(nm);
      const p = .011*f*(r()<.13?4.5:1), o = {n:nm, nat, days:days.length, abs:0, early:0, leave:0};
      days.forEach(d=>{ const w = d.getDay(), q = p*(w===1?1.9:w===5?1.3:1);
        if(r()<q){ o.abs++; dow[w]++; } else if(r()<.025) o.leave++; else if(r()<.02) o.early++; });
      crew.push(o);
    }
    return {name, ban, crew};
  });
  return {teams, dow, prev:-0.6+r()*0.2, sample:true};
}
function realData(){
  const days = workDays(), dow = [0,0,0,0,0,0,0];
  if(shOn() && SH.all){
    const nz = x=>String(x||"").replace(/\s/g,""), byT = {}, T = k=>byT[k];
    const add = (team, name)=>{ const k = nz(team); const t = byT[k] = byT[k]||{name:team, crew:{}}; return t.crew[name] = t.crew[name]||{n:name, recs:{}}; };
    (SH.all.members||[]).forEach(m=>add(m.team, m.name));
    (SH.all.rows||[]).forEach(r=>{ add(r.team, r.name).recs[r.date] = r.code; });
    const teams = Object.entries(byT).map(([k,t])=>{ const ct = S.co.teams.find(x=>nz(x.name)===k);
      return {name:t.name, ban:ct?ct.ban:"", crew:Object.values(t.crew).map(c=>{ const cp = ct && ct.crew.find(p=>p.n===c.n);
        const o = {n:c.n, nat:(cp&&cp.nat)||"", days:0, abs:0, early:0, leave:0};
        days.forEach(d=>{ const v = c.recs[ymd(d)]; if(!v) return; o.days++;
          if(v==="x"){ o.abs++; dow[d.getDay()]++; } else if(v==="e") o.early++; else if(["m","a","l"].includes(v)) o.leave++; });
        return o; })}; });
    return {teams, dow, prev:null, sample:false};
  }
  const teams = S.co.teams.map(t=>({name:t.name, ban:t.ban, crew:t.crew.map(p=>{
    const o = {n:p.n, nat:p.nat||"", days:0, abs:0, early:0, leave:0};
    if(t.id===S.team.id && p.n===S.name) days.forEach(d=>{ const v = S.rec[ymd(d)]; if(!v) return; o.days++;
      if(v==="x"){ o.abs++; dow[d.getDay()]++; } else if(v==="e") o.early++; else if(["m","a","l"].includes(v)) o.leave++; });
    return o; })}));
  return {teams, dow, prev:null, sample:false};
}
function realReady(){ return realData().teams.some(t=>t.crew.some(c=>c.days>=5)); }
function getData(){ return realData(); }
function agg(D){
  const sum = (a,f)=>a.reduce((s,x)=>s+f(x),0), base = c=>c.days-c.leave;
  const all = D.teams.flatMap(t=>t.crew.map(c=>({...c, team:t.name})));
  const rated = all.filter(c=>base(c)>0); rated.forEach(c=>c.rate = (base(c)-c.abs)/base(c)*100);
  const B = sum(rated,base), A = sum(rated,c=>c.abs);
  const teams = D.teams.map(t=>{ const rc = t.crew.filter(c=>base(c)>0), b = sum(rc,base), a = sum(rc,c=>c.abs);
    return {name:t.name, ban:t.ban, n:t.crew.length, abs:a, early:sum(rc,c=>c.early), leave:sum(t.crew,c=>c.leave), rate:b?(b-a)/b*100:null, perfect:rc.filter(c=>!c.abs).length, rated:rc.length}; });
  const nat = {}; all.forEach(c=>{ const k = c.nat||"미입력"; nat[k] = (nat[k]||0)+1; });
  const kr = nat["한국"]||0, known = all.filter(c=>c.nat).length;
  return {all, rated, teams, nat, kr, known, total:all.length, rate:B?(B-A)/B*100:null, absRate:B?A/B*100:null, abs:A, early:sum(rated,c=>c.early), leave:sum(all,c=>c.leave), dow:D.dow, prev:D.prev, sample:D.sample};
}

function bubbles(G){
  let list = Object.entries(G.nat).filter(([k])=>k!=="미입력").sort((a,b)=>b[1]-a[1]);
  if(list.length>5){ const rest = list.slice(4).reduce((s,x)=>s+x[1],0); list = list.slice(0,4).concat([["기타",rest]]); }
  if(!list.length) return `<div class="empty2">조원 국적을 넣으면 인원 구성이 여기에 보여요.<br>조직 관리 › 조 › 이름을 눌러 국적을 정해주세요.</div>`;
  const P = [[30,50],[68,32],[64,76],[88,64],[87,20]], tot = list.reduce((s,x)=>s+x[1],0), mx = list[0][1]/tot;
  const sp = list.map(([k,v],i)=>{ const sh = v/tot, w = Math.max(13, Math.sqrt(sh/mx)*36);
    return `<span style="--c:${NATC[k]||"#8B95A1"};left:${P[i][0]}%;top:${P[i][1]}%;width:${w}%;font-size:${Math.max(12,Math.round(w*.5))}px">${Math.round(sh*100)}%</span>`; }).join("");
  const lg = list.map(([k,v],i)=>`<div><i style="background:${NATC[k]||"#8B95A1"}">${i+1}</i>${esc(k)}<em>${v}명</em></div>`).join("");
  return `<div class="bub">${sp}</div><div class="bleg">${lg}</div>`;
}
function teamRank(G, full){

function natModal(T, i){
  const p = T.crew[i];

}
function adminMem(T, i){
  const p = T.crew[i], opts = [];
  if(p.role!=="leader") opts.push({v:"lead",l:"조장으로 지정",full:1});
  opts.push({v:"sub",l:p.sub?"부조장 해제":"부조장으로 지정",full:1});
  opts.push({v:"nat",l:p.nat?`국적: ${p.nat}`:"국적 정하기",full:1});
  opts.push({v:"ren",l:"이름 바꾸기"},{v:"del",l:"명단에서 빼기",del:1});
  modal(esc(p.n), p.role==="leader"?"지금 조장이에요.":p.sub?"지금 부조장이에요.":"조원이에요.", opts, v=>{
    if(v==="lead"){ T.crew.forEach(x=>{ if(x.role==="leader") delete x.role; }); p.role = "leader"; delete p.sub; if(T.id===S.team.id){ S.leader = null; cat = "me"; } save(); renderAdmin(); toast(`${p.n}님을 조장으로 정했어요`); }
    if(v==="sub"){ const was = p.sub; T.crew.forEach(x=>delete x.sub); if(!was){ p.sub = true; if(p.role==="leader") delete p.role; } save(); renderAdmin(); toast(was?"부조장을 해제했어요":`${p.n}님을 부조장으로 정했어요`); }
    if(v==="nat") return setTimeout(()=>natModal(T,i),50);
    if(v==="del"){ T.crew.splice(i,1); save(); renderAdmin(); toast("명단에서 뺐어요"); }
    if(v==="ren") inputSheet("이름 바꾸기", `지금 이름: ${esc(p.n)}`, p.n, nv=>{ if(!nv) return; if(S.name===p.n && T.id===S.team.id) S.name = nv; p.n = nv; save(); applyRole(); renderAdmin(); toast("이름을 바꿨어요"); });

  sh.innerHTML = `<h3>식단표 넣기</h3><p>식단 시트에서 표를 통째로 복사해 붙여넣으세요. 전 직원 메인 화면에 그날 메뉴가 떠요.</p>
    <div class="two" style="margin-bottom:12px"><button data-mo="0" class="${off===0?"pri":""}">${t.getMonth()+1}월 (이번 달)</button><button data-mo="1" class="${off===1?"pri":""}">${mk(t.getFullYear(),t.getMonth()+1,1).getMonth()+1}월 (다음 달)</button></div>
    <p class="rnote">한식</p><textarea class="adta" id="mealta" rows="6" style="margin-top:0" placeholder="‘${m+1}월 한식’ 표를 복사해서 붙여넣기">${esc(tL)}</textarea>
    <p class="rnote">일품</p><textarea class="adta" id="mealtp" rows="6" style="margin-top:0" placeholder="‘${m+1}월 일품’ 표를 복사해서 붙여넣기">${esc(tP)}</textarea>
    <p class="rnote sm" id="mealpv">${has?`지금 ${has}일 치가 들어 있어요.`:"아직 넣은 식단이 없어요."}</p>
    <button class="opt full" id="mealsv" style="width:100%;margin-top:10px;background:var(--trust);color:#fff;border-color:var(--trust)">${m+1}월 식단 저장하기</button>
    <button class="close" id="cls">닫기</button>`;
  const ta = document.getElementById("mealta"), tp = document.getElementById("mealtp"), pv = document.getElementById("mealpv");
  const both = ()=>{ const a = mealParse(ta.value, y, m, "l"), b = mealParse(tp.value, y, m, "p"), o = {};
    [a,b].forEach(x=>Object.entries(x).forEach(([n,v])=>{ const t2 = o[n] = o[n]||{l:"",p:"",d:""}; ["l","p","d"].forEach(k=>{ if(v[k]) t2[k] = v[k]; }); })); return o; };
  sh.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>mealAdmin(+b.dataset.mo));
  ta.oninput = tp.oninput = ()=>{ const a = Object.keys(mealParse(ta.value, y, m, "l")).length, b = Object.keys(mealParse(tp.value, y, m, "p")).length;
    pv.textContent = (ta.value.trim()||tp.value.trim()) ? `한식 ${a}일 · 일품 ${b}일 치를 알아봤어요.` : "비우고 저장하면 이 달 식단이 지워져요."; };
  document.getElementById("cls").onclick = closeDim;
  document.getElementById("mealsv").onclick = async ()=>{
    const days = both(), n = Object.keys(days).length;
    if((ta.value.trim()||tp.value.trim()) && !n){ toast("날짜를 못 찾았어요"); return; }
    (S.meal = S.meal||{})[ym] = {days, at:Date.now()}; shKeep(); closeDim(); if(view==="today") renderToday();
    if(!shOn()){ toast(`${m+1}월 식단 ${n}일 치를 이 폰에 넣었어요`); return; }
    try{ await fbLoad(); if(!FB.aauth.currentUser) await fbAdminSignIn();
      await withTO(FB.m.setDoc(FB.m.doc(FB.adb, "u2meals", ym), {days, at:Date.now()}), 15000);
      toast(`${m+1}월 식단 ${n}일 치를 올렸어요`);
    }catch(e){ console.warn("[meal]", e && e.message); toast("이 폰에만 넣었어요. 전 직원에게 올리려면 구글 로그인과 권한이 필요해요"); }
  };
  openDim();
}
/* 전 직원: 이번 달(과 다음 달) 식단 받아오기 — 하루에 몇 번만 */
async function mealPull(){
  if(!shOn() || !FB.m || (SH.mealAt && Date.now()-SH.mealAt < 3*3600e3)) return; SH.mealAt = Date.now();
  try{ const t = new Date(), yms2 = [ymd(mk(t.getFullYear(), t.getMonth(), 1)).slice(0,7), ymd(mk(t.getFullYear(), t.getMonth()+1, 1)).slice(0,7)]; let ch = false;
    for(const ym of yms2){ const sn = await withTO(FB.m.getDoc(FB.m.doc(FB.db, "u2meals", ym)), 15000); if(!sn.exists()) continue; const v = sn.data();
      if(!S.meal || !S.meal[ym] || S.meal[ym].at!==v.at){ (S.meal = S.meal||{})[ym] = {days:v.days||{}, at:v.at}; ch = true; } }
    if(ch){ shKeep(); if(view==="today") shRerender(); }
  }catch(e){ SH.mealAt = 0; console.warn("[meal]", e && e.message); }
}

function go(v){
  view = v; if(v!=="admin"){ syncFromLead(); syncAllOut(); wxLoad(); shPull(); } else shPullAll();
  ["team","today","leave","sheet","admin"].forEach(x=>document.getElementById("v-"+x).hidden = x!==v);
  document.body.classList.toggle("wide", v==="admin");
  if(v==="admin"){ document.getElementById("navMe").hidden = true; document.getElementById("navTeam").hidden = true; renderAdmin(); }
  else if(view==="admin" || true){ document.getElementById("navMe").hidden = cat!=="me"; document.getElementById("navTeam").hidden = cat!=="team"; }
  document.querySelectorAll("#navMe button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  if(v==="team") renderTeam();
  if(v==="today") renderToday(); if(v==="leave") renderLeave(); if(v==="sheet") renderSheet();
  window.scrollTo(0,0);
}
document.querySelectorAll("#navMe button").forEach(b=>b.onclick=()=>go(b.dataset.v));
document.querySelectorAll("#navTeam button").forEach(b=>b.onclick=()=>{ tsub = b.dataset.s; go("team"); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !reading) go(view); });
applyRole();
go(cat==="team" ? "team" : "today");
if(TEST && !S.name){   // 테스트용 계정과 조원을 미리 넣어둠
  S.name = "테스트조장"; S.team.name = "테스트조"; S.co.setup = true;
  S.team.crew = [{n:"테스트조장", r:"", role:"leader"}, {n:"김철수", r:"5"}, {n:"이영희", r:"6"}, {n:"박민수", r:"6"}, {n:"최지훈", r:"a"}, {n:"한도윤", r:""}];
  save(); applyRole(); go("today");
}
if(TEST){ const tb = document.createElement("div"); tb.className = "testb"; tb.textContent = "테스트 모드 · 실제 기록과 연결 안 됨"; document.body.appendChild(tb); }
if(!S.name) regModal(); else checkHash();
</script>
